# Cloudflare configuration for local development and D1 migrations.
#
# This project deploys to Cloudflare PAGES (static build in `dist/` + the
# Functions in `functions/`). You normally configure the Pages project in the
# Cloudflare dashboard, but wrangler still uses this file for:
#   - `wrangler pages dev dist`            (local preview with Functions + D1)
#   - `wrangler d1 migrations apply ...`   (running the SQL migrations)

name = "paperly-rsvp"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# D1 database binding. The Functions read it as `env.DB`.
# After you create the database (`wrangler d1 create paperly-rsvp`), paste the
# returned database_id below AND add the same binding in the Pages dashboard
# under Settings → Functions → D1 database bindings.
[[d1_databases]]
binding = "DB"
database_name = "paperly-rsvp"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"
